name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Lint / Format / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22.23.0
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm test -- --ci --coverage

      - name: Build extension
        run: npm run build

      - name: Smoke-check build artifacts
        run: |
          test -f dist/manifest.json
          node -e "const m=require('./dist/manifest.json'); if(!m.version){process.exit(1)}"
          ls dist/src/shared/build-info.json >/dev/null